name: mirada
description: "Mirror and control your iPhone from Linux."
publish_to: 'none'

version: 0.1.2+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  window_manager: ^0.5.1
  shared_preferences: ^2.5.3
  package_info_plus: ^9.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/Inter.ttf
    - assets/icon.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
