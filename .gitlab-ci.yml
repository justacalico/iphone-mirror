stages:
  - sync
  - release
  - pages

variables:
  GLAB_ENABLE_CI_AUTOLOGIN: "true"
  GLAB_VERSION: "1.113.0"
  GIT_DEPTH: "0"

.github-common: &github-common
  tags: [linux-truenas]
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client

github-sync:
  stage: sync
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache bash git github-cli openssh-client
    - sh scripts/setup-ssh-key.sh GITHUB_SSH_PRIVATE_KEY github.com
  script:
    - git remote add github git@github.com:justacalico/iphone-mirror.git || true
    - git remote update github
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        LOCAL_SHA=$(git rev-parse "$CI_COMMIT_TAG")
        REMOTE_SHA=$(git ls-remote --tags github "refs/tags/$CI_COMMIT_TAG" | awk '{print $1}' | head -n1)
        SINCE=""
        if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" = "$LOCAL_SHA" ]; then
          echo "Tag already mirrored"
        else
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          git push -f github "$CI_COMMIT_TAG"
        fi
        if echo "$CI_COMMIT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
          SHA=$(git rev-parse "$CI_COMMIT_TAG^{commit}")
          RUN_ID=$(bash scripts/watch-github-run.sh find --sha "$SHA" --event push ${SINCE:+--since "$SINCE"} || true)
          [ -z "$RUN_ID" ] && { echo "No GitHub run for tag" >&2; exit 1; }
          bash scripts/watch-github-run.sh "$RUN_ID"
        fi
      else
        SHA=$(git rev-parse HEAD)
        REMOTE_MAIN=$(git ls-remote github refs/heads/main | awk '{print $1}')
        SINCE=""
        [ "$REMOTE_MAIN" != "$SHA" ] && SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        git push github HEAD:refs/heads/main
        RUN_ID=$(bash scripts/watch-github-run.sh find --sha "$SHA" --event push --branch main ${SINCE:+--since "$SINCE"} || true)
        [ -z "$RUN_ID" ] && { echo "No GitHub run for $SHA" >&2; exit 1; }
        bash scripts/watch-github-run.sh "$RUN_ID"
      fi

github-mr-build:
  stage: sync
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - sh scripts/setup-ssh-key.sh GITHUB_SSH_PRIVATE_KEY github.com
  script:
    - bash scripts/trigger-github-build.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" true false "$CI_COMMIT_SHA"

auto-release:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  resource_group: auto-release
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: [github-sync]
  variables:
    COCOGITTO_VERSION: "7.0.0"
  before_script:
    - apk add --no-cache bash curl git openssh-client
    - curl -fsSL --retry 3 -o /tmp/cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz"
    - mkdir -p /tmp/cog && tar -xzf /tmp/cog.tar.gz -C /tmp/cog
    - install -m 755 /tmp/cog/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
    - sh scripts/setup-ssh-key.sh GITLAB_RELEASE_SSH_KEY gitlab.com
    - git remote set-url origin git@gitlab.com:${CI_PROJECT_PATH}.git
  script:
    - bash scripts/auto-release.sh

github-release-sync:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  resource_group: release-sync
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "api"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - bash scripts/install-glab.sh
    - sh scripts/setup-ssh-key.sh GITLAB_RELEASE_SSH_KEY gitlab.com
  script:
    - bash scripts/sync-from-github.sh

pages:
  stage: pages
  tags: [linux-truenas]
  image: ghcr.io/cirruslabs/flutter:stable
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mkdir -p public/app public/flatpak
    - flutter config --no-analytics
    - flutter build web --release --base-href /iphone-mirror/app/ -o public/app
    - cd landing && flutter pub get && flutter build web --release --base-href /iphone-mirror/ -o ../public_tmp && cd ..
    - cp -r public_tmp/* public/ && rm -rf public_tmp
    - cp packaging/flatpak/key.gpg public/flatpak/key.gpg
    - |
      KEY_B64=$(base64 -w0 packaging/flatpak/key.gpg)
      cat > public/mirada.flatpakref <<EOF2
      [Flatpak Ref]
      Name=gitlab.httpanimations.mirada
      Branch=stable
      Title=Mirada
      Url=https://httpanimations.gitlab.io/iphone-mirror/flatpak
      SuggestRemoteName=mirada
      GPGKey=$KEY_B64
      RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
      EOF2
    - test -f public/index.html && test -f public/app/index.html
  artifacts:
    paths: [public]
